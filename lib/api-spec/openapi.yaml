openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storefront
    description: Shopify-backed product and cart operations
  - name: orders
    description: UPI order creation and protected admin actions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a pending UPI order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created pending order and UPI payment link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCreated"
        "400":
          description: Invalid order input
        "503":
          description: Firebase or merchant UPI configuration is unavailable
  /admin/devices:
    post:
      operationId: registerAdminDevice
      tags: [orders]
      summary: Register an authenticated admin device for push notifications
      security:
        - FirebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDeviceInput"
      responses:
        "201":
          description: Device registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDevice"
        "401":
          description: Authentication required
        "403":
          description: Admin role required
  /admin/orders/{orderId}:
    patch:
      operationId: updateAdminOrderStatus
      tags: [orders]
      summary: Update an order status as an authenticated admin
      security:
        - FirebaseBearer: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusResult"
        "400":
          description: Invalid status
        "401":
          description: Authentication required
        "403":
          description: Admin role required
        "404":
          description: Order not found
  /store/products:
    get:
      operationId: getStoreProducts
      tags: [storefront]
      summary: List products available to the storefront
      parameters:
        - in: query
          name: category
          schema:
            type: string
            enum: [men, women, kids, shoes]
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Storefront products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreProduct"
  /store/products/{handle}:
    get:
      operationId: getStoreProduct
      tags: [storefront]
      summary: Get a product and its purchasable variants
      parameters:
        - in: path
          name: handle
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Storefront product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreProduct"
        "404":
          description: Product not found
  /store/carts:
    post:
      operationId: createStoreCart
      tags: [storefront]
      summary: Create a Shopify cart
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCartInput"
      responses:
        "201":
          description: Created Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreCart"
  /store/carts/{cartId}:
    get:
      operationId: getStoreCart
      tags: [storefront]
      summary: Retrieve a Shopify cart
      parameters:
        - in: path
          name: cartId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreCart"
  /store/carts/{cartId}/lines:
    post:
      operationId: addStoreCartLine
      tags: [storefront]
      summary: Add a variant to a Shopify cart
      parameters:
        - in: path
          name: cartId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCartLineInput"
      responses:
        "200":
          description: Updated Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreCart"
    patch:
      operationId: updateStoreCartLine
      tags: [storefront]
      summary: Update a Shopify cart line quantity
      parameters:
        - in: path
          name: cartId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCartLineUpdateInput"
      responses:
        "200":
          description: Updated Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreCart"
  /store/carts/{cartId}/lines/{lineId}:
    delete:
      operationId: removeStoreCartLine
      tags: [storefront]
      summary: Remove a line from a Shopify cart
      parameters:
        - in: path
          name: cartId
          required: true
          schema:
            type: string
        - in: path
          name: lineId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreCart"
components:
  schemas:
    OrderInput:
      type: object
      additionalProperties: false
      properties:
        customerName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phoneNumber:
          type: string
          pattern: "^[6-9][0-9]{9}$"
        address:
          type: string
          minLength: 5
          maxLength: 300
        city:
          type: string
          minLength: 1
          maxLength: 80
        pincode:
          type: string
          pattern: "^[1-9][0-9]{5}$"
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/OrderLineInput"
      required: [customerName, phoneNumber, address, city, pincode, items]
    OrderLineInput:
      type: object
      additionalProperties: false
      properties:
        productId:
          type: string
          minLength: 1
          maxLength: 64
        size:
          type: string
          enum: [S, M, L, XL]
        quantity:
          type: integer
          minimum: 1
          maximum: 10
      required: [productId, size, quantity]
    OrderItem:
      type: object
      properties:
        productId:
          type: string
        productName:
          type: string
        size:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: integer
        lineTotal:
          type: integer
      required: [productId, productName, size, quantity, unitPrice, lineTotal]
    OrderCreated:
      type: object
      properties:
        orderId:
          type: string
        totalAmount:
          type: integer
        paymentStatus:
          type: string
          enum: [pending]
        upiUrl:
          type: string
          format: uri
      required: [orderId, totalAmount, paymentStatus, upiUrl]
    AdminDeviceInput:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 5000
      required: [token]
    AdminDevice:
      type: object
      properties:
        registered:
          type: boolean
      required: [registered]
    OrderStatusUpdate:
      type: object
      additionalProperties: false
      properties:
        orderStatus:
          type: string
          enum: [new, confirmed, processing, shipped, delivered, cancelled]
      required: [orderStatus]
    OrderStatusResult:
      type: object
      properties:
        orderId:
          type: string
        orderStatus:
          type: string
          enum: [new, confirmed, processing, shipped, delivered, cancelled]
      required: [orderId, orderStatus]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StoreProductImage:
      type: object
      properties:
        url:
          type: string
        altText:
          type: ["string", "null"]
      required: [url]
    StoreProductOption:
      type: object
      properties:
        name:
          type: string
        values:
          type: array
          items:
            type: string
      required: [name, values]
    StoreProductVariant:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        availableForSale:
          type: boolean
        price:
          type: string
        currencyCode:
          type: string
        selectedOptions:
          type: array
          items:
            $ref: "#/components/schemas/StoreProductOptionValue"
      required: [id, title, availableForSale, price, currencyCode, selectedOptions]
    StoreProductOptionValue:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required: [name, value]
    StoreProduct:
      type: object
      properties:
        id:
          type: string
        handle:
          type: string
        title:
          type: string
        description:
          type: string
        productType:
          type: string
        tags:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/StoreProductImage"
        options:
          type: array
          items:
            $ref: "#/components/schemas/StoreProductOption"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/StoreProductVariant"
      required: [id, handle, title, description, productType, tags, images, options, variants]
    StoreCartLine:
      type: object
      properties:
        id:
          type: string
        merchandiseId:
          type: string
        title:
          type: string
        variantTitle:
          type: string
        image:
          type: ["string", "null"]
        quantity:
          type: integer
        unitPrice:
          type: string
        currencyCode:
          type: string
        lineTotal:
          type: string
      required: [id, merchandiseId, title, variantTitle, quantity, unitPrice, currencyCode, lineTotal]
    StoreCart:
      type: object
      properties:
        id:
          type: string
        checkoutUrl:
          type: string
        totalQuantity:
          type: integer
        subtotal:
          type: string
        currencyCode:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/StoreCartLine"
      required: [id, checkoutUrl, totalQuantity, subtotal, currencyCode, lines]
    StoreCartInput:
      type: object
      properties:
        merchandiseId:
          type: string
        quantity:
          type: integer
          minimum: 1
      required: [merchandiseId, quantity]
    StoreCartLineInput:
      type: object
      properties:
        merchandiseId:
          type: string
        quantity:
          type: integer
          minimum: 1
      required: [merchandiseId, quantity]
    StoreCartLineUpdateInput:
      type: object
      properties:
        lineId:
          type: string
        quantity:
          type: integer
          minimum: 1
      required: [lineId, quantity]
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer

